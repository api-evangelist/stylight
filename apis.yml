aid: stylight
name: Stylight
description: >-
  Stylight is an online fashion and home-decor shopping aggregator that curates
  and compares products from more than 100 retailers, letting shoppers browse
  women's and men's apparel, footwear, accessories, beauty and home furnishings
  across many brands in one place and then complete the purchase on the partner
  retailer's own store. The platform operates localized sites across the US, UK,
  Germany, Austria, Switzerland, France, Italy, Spain, Belgium, the Netherlands
  and Canada, runs an editorial style magazine, and monetizes through affiliate
  partnerships with the retailers it links to. HV Capital was an early backer.
  Stylight publishes no public developer API; this profile captures its public
  web, legal and security surface for the API Evangelist network.
